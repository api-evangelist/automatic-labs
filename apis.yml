name: Automatic Labs
description: 'Automatic Labs was a connected-car company (the Automatic OBD-II adapter and
  companion app plus a developer platform / REST API for trip, vehicle, and driving-behavior
  data), founded circa 2011 and backed by a16z. It was acquired by SiriusXM in 2017 and wound
  down: the service and its developer API were discontinued around May 2020. As of this enrichment
  pass the automatic.com domain (and its api./developer. subdomains) 301-redirects to automattic.com,
  the unrelated WordPress company, so no live API, documentation, or developer surface remains to
  harvest. This profile is retained as a defunct a16z portfolio lead.'
